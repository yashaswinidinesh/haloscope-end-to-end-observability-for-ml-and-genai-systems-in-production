global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: ml-ingester
    static_configs:
      - targets: [ingester:2112]
    metrics_path: /metrics

  - job_name: ml-evaluator
    static_configs:
      - targets: [evaluator:2113]
    metrics_path: /metrics

  - job_name: ml-api
    static_configs:
      - targets: [api:2114]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
